[project]
name = "causica"
version = "0.4.5"
description = "Causal machine learning for AIM (fork of microsoft/causica)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "dataclasses-json>=0.5.7",
  "fsspec>=2024.0.0",
  "igraph>=0.11.3",
  "jsonargparse>=4.0.0,<4.21.0",
  "mlflow>=3.10.1",
  "networkx>=3.0",
  "numpy>=2.0.0",
  "pandas>=2.0.0",
  "pytorch-lightning[extra]>=2.1.0",
  "tensorboard>=2.9.0",
  "tensordict>=0.1.0",
  "torch>=2.0.0",
  "torchmetrics>=1.0.3",
]

[project.optional-dependencies]
seaborn = ["seaborn>=0.13.0"]
plot = ["matplotlib>=3.8.0", "seaborn>=0.13.0"]

[dependency-groups]
dev = [
  "matplotlib>=3.8.0",
  "pytest>=8.3.5",
  "pytest-cov>=7.1.0",
  "types-PyYAML>=6.0.12.2",
]

[tool.uv]
constraint-dependencies = [
  # Required to prevent ancient versions breaking Python 3.13
  "numba>=0.62.1",
  "llvmlite>=0.45.1",
]

[tool.coverage.run]
branch = true
source = ["src/causica"]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
pythonpath = ["src"]
norecursedirs = ["integration"]
addopts = """
 --durations=200
 --cov
 --cov-report html:'../../coverage/packages/causica/html'
 --cov-report xml:'../../coverage/packages/causica/coverage.xml'
 --html:'../../reports/packages/causica/unittests/html/index.html'
 --junitxml:'../../reports/packages/causica/unittests/junit.xml'
"""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causica"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [".ruff_cache", ".svn", ".tox", ".venv", "dist", "research_experiments"]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
  "E",
  "F",
  "UP",
  "B",
  "SIM",
  "I",
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["causica"]
